; PHP settings used by start.bat (php.exe -c php.standalone.ini). start.bat also passes extension_dir.
; Nothing here is secret. To use your own PHP + php.ini instead, run:  php -S 127.0.0.1:8686 router.php

extension=pdo_sqlite
extension=sqlite3
extension=mbstring
extension=fileinfo
extension=gd            ; cached image thumbnails (without it the grid loads the original image files)
extension=pdo_mysql     ; only needed by bin/migrate-mysql-to-sqlite.php and DB_DRIVER=mysql
zend_extension=opcache

opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=1

memory_limit=512M
max_execution_time=300
upload_max_filesize=8M      ; actor photos are limited to 5 MB in the app
post_max_size=12M
file_uploads=1
default_charset=UTF-8
date.timezone=UTC           ; the app sets its own (APP_TIMEZONE in config)

display_errors=0
log_errors=1
error_reporting=E_ALL
zend.assertions=-1
